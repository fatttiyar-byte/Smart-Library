<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FCFAFF"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- نورهای ملایم -->
  <g filter="url(#blur)">
    <circle cx="250" cy="180" r="140" fill="url(#glow)">
      <animate attributeName="cx" values="250;340;250" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="180;230;180" dur="12s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1320" cy="260" r="180" fill="url(#glow)">
      <animate attributeName="cy" values="260;180;260" dur="16s" repeatCount="indefinite"/>
    </circle>

    <circle cx="900" cy="720" r="170" fill="url(#glow)">
      <animate attributeName="cx" values="900;820;900" dur="13s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- خطوط شبیه صفحات کتاب -->
  <g stroke="url(#line)" stroke-width="1.6" fill="none">
    <path d="M100 130 H1500">
      <animate attributeName="stroke-opacity" values=".15;.45;.15" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M140 250 H1460">
      <animate attributeName="stroke-opacity" values=".12;.4;.12" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M90 370 H1510">
      <animate attributeName="stroke-opacity" values=".18;.5;.18" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M160 490 H1440">
      <animate attributeName="stroke-opacity" values=".15;.45;.15" dur="6.5s" repeatCount="indefinite"/>
    </path>
    <path d="M120 610 H1480">
      <animate attributeName="stroke-opacity" values=".12;.42;.12" dur="7.5s" repeatCount="indefinite"/>
    </path>
    <path d="M180 730 H1420">
      <animate attributeName="stroke-opacity" values=".15;.45;.15" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- موج‌های ظریف -->
  <g stroke="#DDD6FE" stroke-width="2" fill="none" opacity=".45">
    <path d="M-100 560 C240 500 420 640 760 560 S1320 500 1700 580">
      <animate attributeName="d"
        dur="11s"
        repeatCount="indefinite"
        values="
        M-100 560 C240 500 420 640 760 560 S1320 500 1700 580;
        M-100 590 C240 540 420 600 760 590 S1320 540 1700 550;
        M-100 560 C240 500 420 640 760 560 S1320 500 1700 580"/>
    </path>
  </g>

  <!-- نقاط درخشان -->
  <g fill="#8B5CF6">
    <circle cx="180" cy="90" r="2">
      <animate attributeName="opacity" values=".15;.8;.15" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="310" r="2.5">
      <animate attributeName="opacity" values=".1;.7;.1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="150" r="2">
      <animate attributeName="opacity" values=".2;.9;.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1380" cy="520" r="3">
      <animate attributeName="opacity" values=".15;.8;.15" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1160" cy="780" r="2.5">
      <animate attributeName="opacity" values=".2;.9;.2" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>